<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HainX ⚡</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#050914;
    color:white;
    overflow:hidden;
}

body::before{
    content:"";
    position:fixed;
    width:400px;
    height:400px;
    background:#168cff;
    filter:blur(160px);
    opacity:.18;
    top:-150px;
    left:-100px;
}

.container{
    width:90%;
    max-width:480px;
    text-align:center;
    padding:40px 25px;
    position:relative;
}

.logo{
    font-size:58px;
    font-weight:bold;
    letter-spacing:3px;
    color:#42caff;
    text-shadow:0 0 30px #168cff88;
}

.jack{
    margin-top:8px;
    color:#7888a8;
    font-size:14px;
    letter-spacing:2px;
}

.avatar{
    width:105px;
    height:105px;
    margin:35px auto 25px;
    border:2px solid #42caff;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:50px;
    box-shadow:0 0 35px #168cff55;
    animation:float 3s ease-in-out infinite;
}

@keyframes float{
    50%{
        transform:translateY(-8px);
        box-shadow:0 0 55px #168cff88;
    }
}

h1{
    font-size:28px;
    margin-bottom:10px;
}

.subtitle{
    color:#8c9ab5;
    line-height:1.6;
    font-size:15px;
    margin-bottom:30px;
}

.input{
    width:100%;
    padding:16px 20px;
    border-radius:14px;
    border:1px solid #263753;
    background:#0b1220;
    color:white;
    outline:none;
    font-size:16px;
    text-align:center;
}

.input:focus{
    border-color:#42caff;
    box-shadow:0 0 20px #168cff33;
}

.preview{
    min-height:25px;
    margin-top:15px;
    color:#42caff;
    font-size:15px;
}

.btn{
    width:100%;
    margin-top:20px;
    padding:16px;
    border:none;
    border-radius:30px;
    background:linear-gradient(90deg,#20bfff,#756cff);
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 0 25px #267cff44;
    transition:.3s;
}

.btn:hover{
    transform:scale(1.03);
}

.note{
    margin-top:25px;
    color:#596982;
    font-size:12px;
}

.error{
    color:#ff7180;
    margin-top:10px;
    font-size:13px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">HainX ⚡</div>

    <div class="jack">BADNAAM JACK 🃏</div>

    <div class="avatar">🤖</div>

    <h1>Welcome, Mystery Hunter 🕵️</h1>

    <p class="subtitle">
        Enter your name and step into the world of
        conversations, friends and mysteries.
    </p>

    <input
        id="name"
        class="input"
        type="text"
        maxlength="20"
        placeholder="Enter your name..."
        oninput="previewName()"
    >

    <div id="preview" class="preview"></div>

    <div id="error" class="error"></div>

    <button class="btn" onclick="enterHainX()">
        🚀 ENTER HAINX
    </button>

    <div class="note">
        🌙 Be kind • Be respectful • Have fun
    </div>

</div>

<script>

function previewName(){

    let name = document.getElementById("name").value.trim();

    if(name){
        document.getElementById("preview").innerText =
        name + " ⚡ HainX";
    }else{
        document.getElementById("preview").innerText = "";
    }

}

function enterHainX(){

    let name = document.getElementById("name").value.trim();

    if(name === ""){
        document.getElementById("error").innerText =
        "Please enter your name first 😄";
        return;
    }

    localStorage.setItem("hainxName", name);

    document.querySelector(".container").innerHTML = `

        <div class="logo">HainX ⚡</div>

        <div class="avatar">🃏</div>

        <h1>Welcome, ${name}!</h1>

        <p class="subtitle">
            Your identity is ready.
            <br><br>
            <strong>${name} ⚡ HainX</strong>
        </p>

        <button class="btn" onclick="alert('🏠 HainX Home coming next!')">
            🏠 ENTER THE WORLD
        </button>

    `;

}

</script>

</body>
</html>
