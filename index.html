<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HainX ⚡</title><style>:root{--b:#050817;--p:#0d1533;--l:#26366f;--t:#eef3ff;--m:#9aa8cf;--c:#55e7ff;--v:#8b7cff;--g:#69f7a6}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#18255d,#050817 55%,#02030a);color:var(--t);font:15px system-ui,Segoe UI,Arial;min-height:100vh}button,input{font:inherit}button{cursor:pointer}.top{height:66px;padding:0 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ffffff12;background:#040716cc;position:sticky;top:0;z-index:4}.brand{font-weight:900;letter-spacing:.12em}.brand i{color:var(--c);font-style:normal}.jack{font-size:11px;color:var(--m);margin-left:12px;letter-spacing:.12em}.wrap{max-width:1100px;margin:auto;padding:55px 20px}.ey{color:var(--g);font-size:11px;letter-spacing:.18em;font-weight:800}.hero h1{font-size:clamp(42px,7vw,76px);line-height:.95;margin:14px 0}.hero h1 span{color:var(--c)}.muted{color:var(--m);line-height:1.6}.card{background:linear-gradient(145deg,#121d44e8,#070c20f2);border:1px solid #7896ff25;border-radius:20px;box-shadow:0 20px 60px #0005}.name{max-width:600px;padding:20px;margin-top:28px}.name input{width:100%;padding:15px;border-radius:12px;border:1px solid var(--l);background:#05091a;color:#fff}.primary{width:100%;padding:14px;margin-top:10px;border:0;border-radius:12px;background:linear-gradient(90deg,var(--c),var(--v));font-weight:900}.head{display:flex;justify-content:space-between;gap:15px;align-items:end;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:15px}.j{padding:20px;text-align:left;min-height:170px;position:relative;color:#fff}.j:hover{border-color:#55e7ff88;transform:translateY(-2px)}.j b{font-size:28px}.j h3{margin:13px 0 6px}.count{position:absolute;right:15px;top:15px;color:var(--c);font-size:12px}.queue{padding:18px;margin-top:18px}.pills{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.pill{background:#111d45;border-radius:99px;padding:6px 10px;font-size:12px}.room{max-width:1200px;margin:auto;padding:28px 20px}.roomhead{display:flex;justify-content:space-between;gap:20px;align-items:center}.roomtitle{font-size:clamp(35px,5vw,58px);margin:8px 0}.actions{display:flex;gap:8px}.sec,.danger,.mic{padding:12px 16px;border-radius:11px;border:1px solid var(--l);background:#0b1431;color:#fff}.danger{color:#ff9aae;border-color:#713044}.seats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:25px 0}.seat{min-height:175px;padding:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.av{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#1b3d7d,#6a48a8);font-size:25px;font-weight:900}.role{font-size:11px;color:#ffd86a;margin-top:5px}.open{color:var(--m);font-size:12px}.voice{padding:18px;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.mic.on{background:var(--g);color:#04120b;border:0;font-weight:900}.mic.off{background:#401c28;color:#ffb4c1;border-color:#7d3347;font-weight:900}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111a3a;border:1px solid var(--l);padding:12px 18px;border-radius:12px;z-index:9}@media(max-width:750px){.seats{grid-template-columns:repeat(2,1fr)}.roomhead{flex-direction:column;align-items:flex-start}.jack{display:none}}</style></head><body><div id="app"></div><div id="toast" class="toast" hidden></div><script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-database-compat.js"></script><script>
const CFG={apiKey:'AIzaSyAFjfk27HrCPqDxfDFTYuP9KyG8knbnUi8',authDomain:'hainx-b7dfa.firebaseapp.com',projectId:'hainx-b7dfa',storageBucket:'hainx-b7dfa.firebasestorage.app',messagingSenderId:'1077891362069',appId:'1:1077891362069:web:8ffab71bfcf4e4c8cd0d1c',measurementId:'G-Y01RM0068'};if(!firebase.apps.length)firebase.initializeApp(CFG);const auth=firebase.auth(),db=firebase.database();
const rooms=[['shadow-forest','🌲','Shadow Forest','Deep whispers among ancient misty pines.'],['midnight-lake','🌊','Midnight Lake','Quiet water. Unknown voices.'],['forgotten-house','🏚️','Forgotten House','A place where old stories remain.'],['silent-valley','🪨','Silent Valley','Somewhere between silence and sound.'],['moon-chamber','🌙','Moon Chamber','A hidden room beneath the night.']];let me,name='',room='',members={},stream=null,listen=null,peers={};const $=s=>document.querySelector(s),toast=x=>{let t=$('#toast');t.textContent=x;t.hidden=false;setTimeout(()=>t.hidden=true,2500)},esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function onboarding(){document.body.innerHTML=`<header class=top><div class=brand>Hain<i>X</i> ⚡ <span class=jack>BADNAAM JACK 🃏</span></div><div class=muted>REAL PEOPLE ONLY</div></header><main class="wrap hero"><div class=ey>REAL PEOPLE ONLY</div><h1>The world<br>behind the <span>screen.</span></h1><p class=muted>Enter a Junction. Meet real people. Every Junction has four seats.</p><div class="name card"><input id=n maxlength=24 placeholder="Enter your name…"><button class=primary id=e>ENTER HAINX ⚡</button></div></main>`;$('#e').onclick=()=>{let n=$('#n').value.trim();if(!n)return toast('Enter your name');name=n;localStorage.hainxName=n;lobby()}}
function lobby(){document.body.innerHTML=`<header class=top><div class=brand>Hain<i>X</i> ⚡ <span class=jack>BADNAAM JACK 🃏</span></div><div class=muted>Connected</div></header><main class=wrap><div class=head><div><div class=ey>CHOOSE YOUR JUNCTION</div><h2>Where do you want to go?</h2><div class=muted>Signed in as <b>${esc(name)}</b></div></div></div><div id=g class=grid></div><div class="queue card"><b>Waiting Room</b><div class=muted>People waiting for an opening.</div><div id=q class=pills></div></div></main>`;rooms.forEach(r=>$('#g').insertAdjacentHTML('beforeend',`<button class="j card" data-r=${r[0]}><b>${r[1]}</b><h3>${r[2]}</h3><div class=muted>${r[3]}</div><span class=count id=c-${r[0]}>0/4</span></button>`));document.querySelectorAll('.j').forEach(x=>x.onclick=()=>join(x.dataset.r));rooms.forEach(r=>db.ref('rooms/'+r[0]+'/members').on('value',s=>{let el=$('#c-'+r[0]);if(el)el.textContent=Object.keys(s.val()||{}).length+'/4'}));db.ref('waiting').on('value',s=>{let q=$('#q');if(q)q.innerHTML=Object.values(s.val()||{}).map(x=>`<span class=pill>${esc(x.name)}</span>`).join('')||'<span class=muted>No one is waiting.</span>'})}
async function join(r){let ref=db.ref(`rooms/${r}/members`);let tx=await ref.transaction(v=>{v=v||{};if(v[me.uid]||Object.keys(v).length<4){v[me.uid]={name,joinedAt:firebase.database.ServerValue.TIMESTAMP};return v}});if(!tx.committed){await db.ref('waiting/'+me.uid).set({name,roomId:r});return toast('Room full — added to Waiting Room.')};await db.ref('waiting/'+me.uid).remove();room=r;openRoom()}
function openRoom(){let r=rooms.find(x=>x[0]===room);document.body.innerHTML=`<header class=top><div class=brand>Hain<i>X</i> ⚡</div><div class=muted>Live Junction</div></header><main class=room><div class=roomhead><div><div class=ey>JUNCTION</div><div class=roomtitle>${r[1]} ${r[2]}</div><div class=muted>${r[3]}</div></div><div class=actions><button class=sec onclick="location.reload()">Lobby</button><button class=danger id=leave>Leave Junction</button></div></div><div id=seats class=seats></div><div class="voice card"><div><b id=vt>Microphone Off</b><div class=muted id=vs>Your voice is private to this room.</div></div><button id=mic class="mic off">🎙 MICROPHONE OFF</button></div></main>`;$('#leave').onclick=leave;$('#mic').onclick=microphone;listen=db.ref(`rooms/${room}/members`).on('value',s=>{members=s.val()||{};draw();sync()})}
function draw(){let a=Object.entries(members);$('#seats').innerHTML=Array.from({length:4},(_,i)=>{if(!a[i])return'<div class="seat card"><div class=open>◌ OPEN SEAT</div></div>';let[u,m]=a[i];return`<div class="seat card"><div class=av>${esc((m.name||'?')[0].toUpperCase())}</div><div><b>${esc(m.name)}</b>${u===me.uid?' (You)':''}</div>${i===0?'<div class=role>👑 MODERATOR</div>':''}</div>`}).join('')}
async function microphone(){if(stream){let t=stream.getAudioTracks()[0];t.enabled=!t.enabled;uiMic(t.enabled);await db.ref(`rooms/${room}/members/${me.uid}/micOn`).set(t.enabled);return}try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false});stream.getAudioTracks()[0].enabled=true;uiMic(true);db.ref(`rooms/${room}/members/${me.uid}/micOn`).set(true);sync()}catch(e){toast('Microphone permission was denied or unavailable.')}}function uiMic(on){let b=$('#mic');b.className='mic '+(on?'on':'off');b.textContent=on?'🎙 MICROPHONE ON':'🎙 MICROPHONE OFF';$('#vt').textContent=on?'Microphone On':'Microphone Off'}
async function peer(uid,offerer){if(peers[uid])return peers[uid];let pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});peers[uid]=pc;if(stream)stream.getTracks().forEach(t=>pc.addTrack(t,stream));pc.ontrack=e=>{let a=document.getElementById('a'+uid)||Object.assign(document.createElement('audio'),{id:'a'+uid,autoplay:true});a.srcObject=e.streams[0];if(!a.parentNode)document.body.appendChild(a)};pc.onicecandidate=e=>e.candidate&&db.ref(`rooms/${room}/sig/${me.uid}/${uid}/ice`).push(e.candidate.toJSON());let s=db.ref(`rooms/${room}/sig/${uid}/${me.uid}`);s.child('offer').on('value',async x=>{let o=x.val();if(o&&!pc.currentRemoteDescription){await pc.setRemoteDescription(o);let an=await pc.createAnswer();await pc.setLocalDescription(an);await db.ref(`rooms/${room}/sig/${me.uid}/${uid}/answer`).set({type:an.type,sdp:an.sdp})}});s.child('answer').on('value',async x=>{let an=x.val();if(an&&!pc.currentRemoteDescription)await pc.setRemoteDescription(an)});db.ref(`rooms/${room}/sig/${uid}/${me.uid}/ice`).on('child_added',x=>pc.addIceCandidate(x.val()).catch(()=>{}));if(offerer){let o=await pc.createOffer();await pc.setLocalDescription(o);await db.ref(`rooms/${room}/sig/${me.uid}/${uid}/offer`).set({type:o.type,sdp:o.sdp})}return pc}
function sync(){Object.keys(members).filter(u=>u!==me.uid).forEach(u=>peer(u,me.uid<u));Object.keys(peers).filter(u=>!members[u]).forEach(u=>{peers[u].close();delete peers[u]})}
async function leave(){if(stream)stream.getTracks().forEach(t=>t.stop());Object.values(peers).forEach(p=>p.close());peers={};if(listen)db.ref(`rooms/${room}/members`).off('value',listen);if(me)await db.ref(`rooms/${room}/members/${me.uid}`).remove();room='';location.reload()}
auth.onAuthStateChanged(u=>{me=u;if(u){let x=localStorage.hainxName;if(x){name=x;lobby()}else onboarding()}});auth.signInAnonymously().catch(e=>{console.error(e);toast('Firebase Anonymous Auth is not enabled.')});
</script></body></html>
