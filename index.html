<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SunoYaar</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#0f172a;
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      text-align:center;
      padding:20px;
    }

    .container{
      max-width:700px;
    }

    h1{
      font-size:60px;
      margin-bottom:20px;
      color:#38bdf8;
    }

    p{
      font-size:20px;
      line-height:1.7;
      color:#cbd5e1;
      margin-bottom:30px;
    }

    .btn{
      display:inline-block;
      padding:15px 35px;
      background:#38bdf8;
      color:#0f172a;
      text-decoration:none;
      font-size:18px;
      border-radius:40px;
      transition:0.3s;
      font-weight:bold;
    }

    .btn:hover{
      background:white;
      transform:scale(1.05);
    }

    .footer{
      margin-top:40px;
      color:#94a3b8;
      font-size:14px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>SunoYaar</h1>

    <p>
      Feeling alone? <br>
      Overthinking? <br>
      Need someone who truly listens? <br><br>

      Welcome to SunoYaar 💙 <br>
      A safe space where you can share your feelings,
      talk freely, and connect like a real friend.
    </p>

    <a href="#" class="btn">Start Talking</a>

    <div class="footer">
      Made with care by Burhan ✨
    </div>
  </div>

</body>
</html>
