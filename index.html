<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07172e">
  <title>HainX ⚡ | Badnaam Jack World</title>
  <style>
    :root{color-scheme:dark;--bg:#07172e;--panel:#102542;--line:#315477;--cyan:#65eaff;--text:#eef8ff;--muted:#a9bfd6;--pink:#ffb5d8}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 15%,#17385e 0,#0b1d36 42%,var(--bg) 100%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
    header{padding:22px 14px 18px;text-align:center;background:linear-gradient(110deg,#102e53,#153b65);border-bottom:1px solid #315779;box-shadow:0 7px 24px #0003}
    .cat{display:block;width:54px;height:54px;margin:0 auto 3px;filter:drop-shadow(0 0 9px #65eaff88)}
    h1{margin:0;color:var(--cyan);font-size:28px;letter-spacing:.4px}
    header p{margin:3px 0 0;font-size:11px;font-weight:800;letter-spacing:.45px}
    main{width:min(760px,92%);margin:auto; padding:44px 0;}
    .welcome{position:relative;overflow:hidden;text-align:center;padding:clamp(28px,7vw,54px) 18px;border:1px solid #47709a;border-radius:18px;background:linear-gradient(145deg,#122b4b,#0c1e37);box-shadow:0 18px 50px #0004,0 0 28px #65eaff12}
    .welcome:before{content:"";position:absolute;inset:-80% -30%;background:linear-gradient(110deg,transparent 43%,#ffffff0b 50%,transparent 57%);transform:translateX(-45%);animation:shine 7s ease-in-out infinite}
    .welcome h2{position:relative;margin:0;color:#ffe0ef;font-size:clamp(22px,5vw,34px);line-height:1.35;text-shadow:0 0 14px #ff8bc966}
    .heartline{position:relative;margin:17px 0 0;color:var(--pink);font-size:22px;letter-spacing:7px;animation:pulse 2.4s ease-in-out infinite}
    .sub{position:relative;margin:13px 0 0;color:var(--muted);font-size:13px}
    footer{text-align:center;padding:18px 10px 25px;color:#8ea7c3;font-size:11px;font-weight:700}
    .float{position:fixed;bottom:-30px;pointer-events:none;animation:floatUp 6s linear forwards;z-index:3}
    @keyframes pulse{50%{transform:scale(1.07);text-shadow:0 0 16px #ff8bc9}}
    @keyframes shine{0%,65%{transform:translateX(-50%)}100%{transform:translateX(50%)}}
    @keyframes floatUp{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
    @media(prefers-reduced-motion:reduce){*,*:before{animation:none!important}}
  </style>
</head>
<body>
  <header>
    <svg class="cat" viewBox="0 0 64 64" role="img" aria-label="HainX cat logo">
      <path d="M8 27 7 7l17 10Q32 13 40 17L57 7l-1 21q5 7 2 17-6 14-26 14T6 45q-4-10 2-18Z" fill="#70eaff"/>
      <path d="M14 27 12 13l11 7M50 27l2-14-11 7" fill="#9af5ff"/>
      <ellipse cx="22" cy="34" rx="3" ry="4" fill="#09213a"/><ellipse cx="42" cy="34" rx="3" ry="4" fill="#09213a"/>
      <path d="M28 43q4 4 8 0l-4-4Z" fill="#09213a"/><path d="M32 47q-4 5-8 1m8-1q4 5 8 1" fill="none" stroke="#09213a" stroke-width="2" stroke-linecap="round"/>
      <path d="M8 40 20 42M8 46l12-2m36-4-12 2m12 4-12-2" stroke="#0b3854" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <h1>HainX ⚡</h1>
    <p>BADNAAM JACK 🃏 | Real People. Real Connections.</p>
  </header>
  <main>
    <section class="welcome" aria-label="Special welcome">
      <h2>Welcome to Badnaam Jack World, Kriti ❤️</h2>
      <div class="heartline" aria-hidden="true">♡ ♥ ♡ ♥ ♡</div>
      <p class="sub">A little world made with warmth and good wishes.</p>
    </section>
  </main>
  <footer>Created with ⚡ by <b>Badnaam Jack 🃏</b><br>HainX — Real People. Real Connections.</footer>
  <script>
    (()=>{
      if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
      const symbols=['♡','♥','✦'];
      function floatHeart(){
        const el=document.createElement('span');el.className='float';el.textContent=symbols[Math.floor(Math.random()*symbols.length)];
        el.style.left=(5+Math.random()*90)+'vw';el.style.color=Math.random()>.5?'#ffb5d8':'#8deeff';
        el.style.fontSize=(14+Math.random()*13)+'px';el.style.animationDuration=(5+Math.random()*3)+'s';
        document.body.appendChild(el);el.addEventListener('animationend',()=>el.remove(),{once:true});
      }
      setInterval(floatHeart,1300);
    })();
  </script>
</body>
</html>
